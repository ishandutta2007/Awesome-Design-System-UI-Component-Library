<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-30px, 25px) scale(1.2); opacity: 0.5; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .orb-1 { animation: pulseOrb1 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite; }
    .flowing-line { stroke-dasharray: 6 6; animation: dashMove 2.5s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <g>
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#6366f1" filter="url(#glowBlur)" />
    <circle class="orb-2" cx="980" cy="300" r="160" fill="#06b6d4" filter="url(#glowBlur)" />
    <circle class="orb-1" cx="800" cy="100" r="120" fill="#d946ef" filter="url(#glowBlur)" opacity="0.25" />
  </g>

  <!-- Flowing Architectural Lines (in background) -->
  <g opacity="0.35">
    <path class="flowing-line" d="M 50 80 Q 300 20 600 120 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flowing-line" d="M 50 340 Q 350 400 700 320 T 1150 350" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Floating UI Accent Nodes / Badges (in background relative to main title) -->
  <g class="pill-1" opacity="0.85">
    <rect x="940" y="70" width="170" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="960" cy="89" r="5" fill="#38bdf8" />
    <text x="975" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">Tokens &amp; Primitives</text>
  </g>

  <g class="pill-2" opacity="0.85">
    <rect x="80" y="310" width="180" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="100" cy="329" r="5" fill="#818cf8" />
    <text x="115" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">WCAG &amp; Accessible</text>
  </g>

  <g class="pill-1" opacity="0.85">
    <rect x="960" y="270" width="160" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="980" cy="289" r="5" fill="#ec4899" />
    <text x="995" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbcfe8">React · Vue · Web</text>
  </g>

  <!-- FOREGROUND: Category Tag Badge -->
  <g>
    <rect x="440" y="65" width="320" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="url(#accentGrad)" stroke-width="1.5" />
    <circle cx="458" cy="82" r="5" fill="#10b981" />
    <text x="472" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#e2e8f0">THE DEFINITIVE AWESOME COLLECTION</text>
  </g>

  <!-- FOREGROUND: Main Titles & Subtitles -->
  <!-- Crisp high-contrast drop shadow for maximum foreground readability -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" fill="url(#primaryGrad)">
      Design Systems &amp; UI Component Libraries
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Catalog of SaaS Platforms, Design Token Engines &amp; Open-Source Frameworks
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(600, 260)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
        🎨 Design Tokens  ·  ♿ WCAG 2.2 Accessible  ·  ⚡ Multi-Framework Primitives  ·  🛠️ Developer Experience
      </text>
    </g>

    <!-- Tech Stack Pill Group -->
    <g transform="translate(600, 310)">
      <rect x="-310" y="0" width="620" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">
        Figma  •  Storybook  •  shadcn/ui  •  MUI  •  Tailwind CSS  •  Radix  •  Ant Design  •  zeroheight
      </text>
    </g>
  </g>
</svg>
